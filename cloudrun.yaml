# Cloud Run service spec for project node-server-apis.
# Apply after an image exists, or use the gcloud run deploy --source command in README.md.
#
#   gcloud run services replace cloudrun.yaml --region us-east1 --project node-server-apis
#
# Image is a placeholder — `gcloud run deploy --source .` builds and sets it.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pulzivo-analytics
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '3'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/node-server-apis/pulzivo-analytics
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 1
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '8080'
            - name: HOST
              value: 0.0.0.0
