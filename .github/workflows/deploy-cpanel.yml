name: Deploy to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Create .htaccess for SPA
        run: cp public/.htaccess dist/simpletrack-prime-ng/browser/.htaccess
      - name: Check security headers against the built HTML
        run: node --test scripts/security-headers.spec.js
      # FTP-Deploy-Action can speak explicit FTPS (`protocol: ftps`, port 21,
      # AUTH TLS). It is not enabled. This change was made without the FTP
      # secret values and without connecting to the DomainRacer host, so TLS
      # was not tested. cPanel's certificate often does not match the hostname
      # stored in FTP_HOST, which needs `security: loose` (the action default)
      # rather than `security: strict`. After an explicit-FTPS login works for
      # this account, set protocol: ftps, port: 21, and security: loose or strict.
      # Secrets used by this job (names only): FTP_HOST, FTP_USERNAME, FTP_PASSWORD.
      - name: Forget remote FTP sync state
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/clear-ftp-sync-state.py
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Plain FTP until explicit FTPS is confirmed. See the note above.
          protocol: ftp
          local-dir: ./dist/simpletrack-prime-ng/browser/
          # FTP user is already chrooted/homed to public_html (the real web root).
          # Using /public_html/ here created a nested public_html/public_html/ and
          # left the live site serving the old login-root build.
          server-dir: ./
      - name: Verify live URLs match the build
        run: node scripts/deploy-verify.js --origin https://pulzivo.com --dist dist/simpletrack-prime-ng/browser
