# TEMPORARY incident-response workflow. Do not merge to main.
# Read-only FTP mirror of the live cPanel docroot. Deleted with this branch
# after evidence is saved. The artifact is the evidence and is retained.

name: Incident FTP evidence (temporary)

on:
  push:
    branches:
      - cursor/incident-spam-cleanup-4ae5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-ftp-pulzivo
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror FTP root (read-only)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/incident_ftp_mirror.py

      - name: Upload FTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftp-root-evidence-2026-11-20
          path: evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
