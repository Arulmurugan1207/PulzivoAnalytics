name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Server + copy honesty
        run: |
          npm run test:server
          npm run test:copy
      - name: Analytics API routes
        run: |
          npm ci --prefix analytics-api
          npm run test:analytics-api
      - name: Analytics API image includes runtime modules
        run: |
          docker build -t pulzivo-analytics-api:ci analytics-api
          docker run --rm --entrypoint node pulzivo-analytics-api:ci -e "require('./query'); require('./metrics'); require('./server'); console.log('modules-ok');"
