# TEMPORARY. Deletes the public FTP evidence artifact, then this branch is removed.
# Does not connect to the server and does not upload a new artifact.

name: Delete public evidence artifact

on:
  push:
    branches:
      - cursor/incident-spam-cleanup-4ae5

permissions:
  actions: write
  contents: read

jobs:
  delete-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ftp-root-evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="ftp-root-evidence-2026-11-20") | .id')
          if [ -z "$ids" ]; then
            echo "artifact already absent"
            exit 0
          fi
          for id in $ids; do
            echo "deleting artifact ${id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            echo "deleted ${id}"
          done
