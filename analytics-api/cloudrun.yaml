# Distinct Cloud Run service for the Analytics Node API (ingest).
# Do NOT apply this over the existing Pulzivo marketing SPA service named `analytics`
# (https://analytics-167308220305.us-east1.run.app).
#
#   gcloud run services replace analytics-api/cloudrun.yaml \
#     --region us-east1 --project node-server-apis
#
# Prefer `gcloud run deploy pulzivo-analytics-api --source analytics-api ...`
# so the image digest is set. Leave App Engine service `analytics` running.
#
# A source deploy REPLACES cpu / memory / min-instances with the flags you pass.
# Keep the live mitigation (revision pulzivo-analytics-api-00010-wvt and later):
#   --cpu 2 --memory 1Gi --min-instances 1
# Dropping those flags silently returns the service to 512Mi / 1 CPU / scale-to-zero.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pulzivo-analytics-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/node-server-apis/pulzivo-analytics-api
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '2'
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '8080'
            - name: HOST
              value: 0.0.0.0
            - name: MONGODB_DB
              value: analytics
            - name: API_KEYS_COLLECTION
              value: api_keys
            - name: EVENTS_COLLECTION
              value: events
            # CORS defaults in server.js: tabletennistube.com + pulzivo.com (+ www).
            # Prod Mongo URI must match AE analytics. Inject at deploy:
            #   --set-secrets=MONGODB_URI=analytics-mongodb-uri:latest
